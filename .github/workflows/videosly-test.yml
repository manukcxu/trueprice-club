name: Videosly Test Post (manual, 2 products, immediate)
on:
  workflow_dispatch:
jobs:
  test-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Videosly scheduler (2 products, immediate)
        env:
          VIDEOSLY_API_KEY: ${{ secrets.VIDEOSLY_API_KEY }}
          PRODUCT_COUNT: "2"
        run: node scripts/videosly-scheduler.js
