name: Videosly Automation Schedule

on:
  schedule:
    - cron: '0 6,9,12,15,18,21 * * *'
  workflow_dispatch:

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Videosly Scheduler
        env:
          VIDEOSLY_API_KEY: ${{ secrets.VIDEOSLY_API_KEY }}
        run: node scripts/videosly-scheduler.js
