name: Weekly Catalog Auto-Maintainer
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: node scripts/maintainer.mjs
      - run: |
          git config --global user.name "trueprice-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add src/data/products.json
          git diff --staged --quiet || (git commit -m "chore: auto-update top 5 products [30% markup]" && git push)
